# Render Infrastructure-as-Code Blueprint Specification
# Deploys FastAPI Backend + React/Vite Frontend

services:
  # 1. FastAPI Production Backend
  - type: web
    name: diagnostic-recommender-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false

  # 2. React / Vite Static Frontend
  - type: web
    name: diagnostic-recommender-web
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://diagnostic-recommender-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
